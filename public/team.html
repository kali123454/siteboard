<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f3b37">
<link rel="manifest" id="manifest" href="/manifest-team.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="עובדים">
<title>עובדים - לוח עבודות</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=IBM+Plex+Mono:wght@500;600&family=Secular+One&display=swap">
<style>
/* Layout: מסך יחיד — כותרת אתר, שורת סיכום, ואז "חתך בניין": קומות בשורות (עליונה למעלה), בעלי מקצוע בעמודות */
:root{
  --bg:#eef0ee; --surface:#ffffff; --ink:#1d2421; --muted:#5f6b66; --line:#d5dad7;
  --accent:#f2b705; --accent-ink:#1d2421; --steel:#2f3b37;
  --ok:#1f8a4c; --ok-bg:#dff2e6; --wait:#9a6b00; --wait-bg:#fff1c2; --bad:#b4372f; --bad-bg:#fbe1de; --idle-bg:#eceeed;
  --f-display:"Secular One","Assistant",system-ui,sans-serif;
  --f-body:"Assistant",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151a18; --surface:#1e2522; --ink:#e7ece9; --muted:#9aa6a1; --line:#33403b;
  --accent:#f2b705; --accent-ink:#151a18; --steel:#0f1311;
  --ok:#5cc98a; --ok-bg:#173726; --wait:#f2c94c; --wait-bg:#3a3010; --bad:#f08077; --bad-bg:#3d1d1a; --idle-bg:#262e2b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151a18; --surface:#1e2522; --ink:#e7ece9; --muted:#9aa6a1; --line:#33403b;
  --accent:#f2b705; --accent-ink:#151a18; --steel:#0f1311;
  --ok:#5cc98a; --ok-bg:#173726; --wait:#f2c94c; --wait-bg:#3a3010; --bad:#f08077; --bad-bg:#3d1d1a; --idle-bg:#262e2b; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;direction:rtl}
.wrap{max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:20px 48px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 12px;width:100%}
label{display:grid;gap:4px;font-weight:600;font-size:14px}
.btn{border:0;border-radius:6px;padding:10px 16px;font-weight:700;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.ok{background:var(--ok);color:#fff}
.btn.bad{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.btn.sm{padding:6px 12px;font-size:14px}
.btn:disabled{opacity:.5;cursor:default}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.err{color:var(--bad);font-weight:600;min-height:1.5em;font-size:14px}

/* top bar: tape stripe = the site's warning tape */
.tape{height:8px;background:repeating-linear-gradient(-45deg,var(--accent) 0 14px,var(--steel) 14px 28px)}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding-block:16px}
.top h1{font-size:26px}
.who{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.role{font-size:13px;font-weight:700;background:var(--steel);color:#fff;border-radius:4px;padding:2px 8px}
.demo{background:var(--wait-bg);color:var(--wait);border-radius:6px;padding:8px 12px;font-size:14px;margin-bottom:12px}

/* login */
.login{max-width:380px;margin:8vh auto 0;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.login .in{padding:24px;display:grid;gap:14px}
.login h1{font-size:28px}

.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:20px;overflow-x:auto}
.tabs button{background:none;border:0;padding:10px 14px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.stat b{display:block;font-family:var(--f-mono);font-size:28px;font-variant-numeric:tabular-nums}
.stat span{font-size:14px;color:var(--muted)}
.bar{height:6px;background:var(--idle-bg);border-radius:3px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}

.queue{background:var(--surface);border:1px solid var(--line);border-inline-start:5px solid var(--accent);border-radius:8px;padding:14px;margin-bottom:20px}
.queue h2{font-size:19px;margin-bottom:8px}
.qrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding-block:10px;border-top:1px solid var(--line)}
.qrow:first-of-type{border-top:0}
.qrow .txt{flex:1 1 220px;min-width:0}

/* building grid */
.gridwrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;min-width:520px}
th,td{padding:8px;border-bottom:1px solid var(--line);text-align:center}
thead th{font-size:14px;color:var(--muted);font-weight:700;background:var(--surface);position:sticky;top:0}
tbody th{font-family:var(--f-mono);font-size:15px;white-space:nowrap;width:76px;background:var(--idle-bg)}
.cell{width:100%;border:0;border-radius:5px;padding:8px 4px;font-size:13px;font-weight:700;line-height:1.2}
.s-pending{background:var(--idle-bg);color:var(--muted)}
.s-done{background:var(--wait-bg);color:var(--wait)}
.s-approved{background:var(--ok-bg);color:var(--ok)}
.s-rejected{background:var(--bad-bg);color:var(--bad)}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;font-size:13px}
.legend span{padding:2px 8px;border-radius:4px;font-weight:700}

/* worker floors */
.floors{display:grid;gap:10px}
.floor{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.floor .num{font-family:var(--f-mono);font-size:22px;min-width:64px}
.floor .info{flex:1 1 180px;min-width:0}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:13px;font-weight:700}
.note{font-size:14px;color:var(--muted);margin-top:2px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:16px}
.card h2{font-size:20px;margin-bottom:12px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;align-items:end}
.list{display:grid;gap:0}
.li{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding-block:10px;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .grow{flex:1 1 200px;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--idle-bg);border-radius:999px;padding:4px 6px 4px 12px;font-weight:600}
.chip button{border:0;background:none;color:var(--muted);font-size:16px;line-height:1;padding:2px 6px}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;padding:16px;z-index:10}
.sheet{background:var(--surface);border-radius:10px;width:100%;max-width:460px;padding:20px;display:grid;gap:12px;max-height:90%;overflow:auto}
.sheet h3{font-size:22px}
.row{display:flex;flex-wrap:wrap;gap:8px}
.smsbox{background:var(--idle-bg);border-radius:8px;padding:10px 12px;white-space:pre-wrap}
.unread{font-weight:700}
.creds td,.creds th{text-align:start;white-space:nowrap}
a.btn{text-decoration:none;display:inline-block}
.group{display:grid;gap:8px;border-top:2px solid var(--accent);padding-top:12px;margin-top:4px}
.notify{border-top:1px solid var(--line);padding-block:10px;display:grid;gap:6px}
.checks{display:flex;flex-wrap:wrap;gap:6px 18px}
.ck{display:flex;align-items:center;gap:6px;font-weight:400;font-size:15px}
.ck input{width:auto}
.assign select{padding:6px 8px;font-size:14px;min-width:110px}
.allrow th,.allrow td{background:var(--wait-bg)}
.who-s{display:block;font-weight:400;font-size:12px;opacity:.85;margin-top:2px}
.toast{position:fixed;inset-inline:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--bad);color:#fff;padding:12px 16px;border-radius:8px;font-weight:700;z-index:20;text-align:center}
textarea.need{border-color:var(--bad);outline:2px solid var(--bad)}
.ptitle{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;min-width:0}
.pick{width:auto;max-width:100%;padding:6px 10px;font-weight:700}
.bform{display:grid;gap:8px}
@media (min-width:640px){.bform{grid-template-columns:1fr auto;align-items:end}}
.others{flex-basis:100%;border-top:1px solid var(--line);padding-top:8px;font-size:14px}
.others summary{cursor:pointer;font-weight:700;color:var(--muted)}
.orow{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;padding-block:8px;border-bottom:1px solid var(--line)}
.orow:last-child{border-bottom:0}
.op{text-align:start}
a.tel{color:var(--ink)}
#notice{position:fixed;inset-inline:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--surface);border:1px solid var(--line);border-inline-start:5px solid var(--ok);border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.18);padding:10px 12px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;max-width:560px;margin-inline:auto}
#notice .ntext{flex:1 1 220px;min-width:0;display:grid}
#notice .ntext span{font-size:14px;color:var(--muted)}
#notice .nx{border:0;background:none;font-size:22px;line-height:1;color:var(--muted);padding:0 4px}
.pushcard{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;border-inline-start:5px solid var(--accent)}
.pushcard .grow{flex:1 1 200px}
.pushcard.ok{border-inline-start-color:var(--ok);padding-block:10px}
tbody th.uname{font-family:var(--f-body);font-weight:700;white-space:normal;text-align:start;min-width:90px}
.log{font-size:13px;color:var(--muted);display:grid;gap:2px;border-top:1px solid var(--line);padding-top:8px}
@media (min-width:640px){.scrim{align-items:center}}
@media (prefers-reduced-motion:no-preference){.cell,.btn{transition:filter .15s}.cell:hover,.btn:hover{filter:brightness(.95)}}
</style>
</head>
<body>

<div class="tape"></div>
<div class="wrap" id="app"><p class="muted">טוען…</p></div>
<div id="modal"></div>

<script>
const STATUS = {
  pending:{t:"לא בוצע",c:"s-pending"},
  done:{t:"ממתין לאישור",c:"s-done"},
  approved:{t:"אושר",c:"s-approved"},
  rejected:{t:"הוחזר לתיקון",c:"s-rejected"}
};
const DEFAULT_TRADES = ["טיח","אינסטלציה","חשמל","ריצוף","צבע"];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = ts => ts ? new Date(ts).toLocaleString("he-IL",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}) : "";
/* סוגי פרויקטים: בניין לפי קומות, והשאר לפי רשימת יחידות (אזורים / בתים / חדרים) */
const PTYPES = {
  building:  {label:"בניין",          one:"קומה", many:"קומות", count:"מספר קומות (מעל קרקע)", def:5},
  house:     {label:"בית פרטי",       one:"אזור", many:"אזורים", units:["מרתף","קומת קרקע","קומה א׳","גג","חצר ופיתוח"]},
  street:    {label:"רחוב / שכונה",   one:"בית",  many:"בתים",  count:"מספר בתים / מגרשים", def:8, prefix:"בית "},
  apartment: {label:"שיפוץ דירה",     one:"חדר",  many:"חדרים", units:["סלון","מטבח","חדר שינה","חדר ילדים","חדר רחצה","שירותים","מרפסת"]},
  office:    {label:"משרד / מסחרי",   one:"אזור", many:"אזורים", units:["כניסה ולובי","אופן ספייס","חדרי ישיבות","מטבחון","שירותים","חדר תקשורת"]},
  infra:     {label:"תשתיות וכבישים", one:"קטע",  many:"קטעים", count:"מספר קטעים", def:6, prefix:"קטע "}
};
const ptype = (p=project()) => PTYPES[p.type] ? p.type : "building";
const PT = (p=project()) => PTYPES[ptype(p)];
const unitsOf = (p=project()) => ptype(p)==="building" ? null : (p.units||[]);
function makeUnits(type, n){
  const t = PTYPES[type];
  const names = t.units ? t.units : Array.from({length:Math.max(1,Math.min(200,n||t.def))},(_,i)=>t.prefix+(i+1));
  return names.map((name,i)=>({id:i, name}));
}
const floorName = f => { const U = unitsOf(); if(!U) return f === 0 ? "קרקע" : "קומה " + f; const u = U.find(x=>x.id===f); return u ? u.name : PT().one; };
const floorShort = f => { const U = unitsOf(); if(!U) return f===0 ? "ק׳" : String(f); return esc(floorName(f)); };
const unitCount = p => { const U = unitsOf(p); return U ? U.length : (+p.floors||0)+1; };
const ls = {get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}};

/* ---------- שרת ---------- */
const data = { users:{}, tasks:{}, projects:{}, messages:{} };
let creds = {}, loaded = false, isSetup = false, projectName = "", vapidPublic = "";
let token = ls.get("siteboard-token");

function apply(st){
  if(!st) return;
  isSetup = !!st.setup; projectName = st.projectName || ""; vapidPublic = st.vapidPublic || vapidPublic;
  ui.me = st.me || null;
  data.users = st.users || {}; data.tasks = st.tasks || {}; data.messages = st.messages || {};
  data.projects = st.projects || {}; creds = st.creds || {};
  const vis = visibleProjects();
  if(!vis.includes(ui.pid)) ui.pid = vis[0] || "";
  loaded = true;
}
async function api(path, body){
  const res = await fetch("/api/"+path, {
    method: body===undefined ? "GET" : "POST",
    headers: {"content-type":"application/json", ...(token?{authorization:"Bearer "+token}:{})},
    body: body===undefined ? undefined : JSON.stringify(body)
  });
  const out = await res.json().catch(()=>({error:"אין חיבור לשרת. בדוק את האינטרנט ונסה שוב."}));
  if(res.status===401 && path!=="login"){ token=null; ls.set("siteboard-token",null); ui.me=null; }
  if(!res.ok) throw new Error(out.error || "השמירה נכשלה. נסה שוב.");
  if(out.token){ token = out.token; ls.set("siteboard-token", token); setTimeout(syncPush, 300); }
  apply(out.state || out);
  render();
  return out;
}
async function refresh(){
  try{ await api("state"); }catch(e){ if(!loaded){ document.getElementById("app").innerHTML = '<div class="card"><p>אין חיבור לשרת. בדוק את האינטרנט ורענן את הדף.</p></div>'; } }
}
const put = (col,id,obj) => api("put",{col,id,obj});
const remove = (col,id) => api("remove",{col,id});
async function notify(to, text){
  const id = "m" + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
  await put("messages", id, {to, text});
}
/* עדכון אוטומטי כל 15 שניות, בלי להפריע למי שמקליד */
setInterval(()=>{
  if(!token || document.getElementById("modal").innerHTML) return;
  const a = document.activeElement; if(a && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) return;
  refresh();
}, 15000);

/* ---------- app state ---------- */
const PATH = location.pathname.replace(/\/+$/,"").split("/").pop() || (location.hash||"").slice(1);
const PORTAL = PATH==="team" ? "team" : PATH==="manager" ? "manager" : "";
const ui = { tab:"board", err:"", me: null, pid: ls.get("siteboard-pid") || "" };
const project = () => data.projects[ui.pid] || {name:projectName||"לוח עבודות באתר",floors:0,trades:[]};
/* פרויקטים שהמשתמש רואה: מנהל — כולם; עובד — מה ששובץ אליו, או פרויקט שבו המקצוע שלו לא שובץ לאף אחד */
function visibleProjects(){
  const ids = Object.keys(data.projects).sort((a,b)=>(data.projects[a].created||0)-(data.projects[b].created||0));
  const u = ui.me ? data.users[ui.me] : null;
  if(!u || u.role==="manager") return ids;
  return ids.filter(pid=>{ const A = Object.entries(data.projects[pid].assign||{}).filter(([k])=>k.endsWith("_"+u.trade));
    return !A.length || A.some(([,v])=>v===ui.me); });
}
const trades = () => project().trades || [];
const floorsList = () => { const U = unitsOf(); if(U) return U.map(u=>u.id); const n = +project().floors || 0; const a=[]; for(let i=n;i>=0;i--) a.push(i); return a; };
const localId = (f,k) => "f"+f+"_"+k;
const taskId = (f,k) => ui.pid+"__"+localId(f,k);
const task = (f,k) => data.tasks[taskId(f,k)] || {floor:f,trade:k,status:"pending",log:[]};
const tradeLabel = k => (trades().find(t=>t.key===k)||{}).label || k;
const me = () => ui.me ? data.users[ui.me] : null;
const assignee = (f,k) => { const id = (project().assign||{})[localId(f,k)]; return id && data.users[id] ? id : ""; };
/* מי אחראי על מקצוע בקומה: המשובץ, ואם אין — כל בעלי המקצוע */
const responsible = (f,k) => { const a = assignee(f,k); return a ? [a] : Object.keys(data.users).filter(id=>data.users[id].role==="worker"&&data.users[id].trade===k); };

async function saveTask(f,k,patch,logText){
  const cur = task(f,k);
  const log = [...(cur.log||[]), {at:Date.now(), by:me()?.name||"", t:logText}].slice(-15);
  await put("tasks", taskId(f,k), {...cur, ...patch, floor:f, trade:k, pid:ui.pid, log});
}

/* העובדים של פרויקט: מי ששובץ אליו, או בעל מקצוע שהמקצוע שלו לא שובץ בפרויקט לאף אחד */
function projectWorkers(pid){
  const A = Object.entries((data.projects[pid]||{}).assign||{});
  return Object.keys(data.users).filter(id=>{ const u=data.users[id]; if(u.role!=="worker") return false;
    const mine = A.filter(([k])=>k.endsWith("_"+u.trade)); return !mine.length || mine.some(([,v])=>v===id); });
}
function broadcastCard(){
  const W = projectWorkers(ui.pid);
  return `<div class="card bcast"><h2>הודעה לכל העובדים בפרויקט</h2>
    <p class="note" style="margin-top:-6px">נשלחת ל-${W.length} עובדים ב${esc(project().name)}: ${W.map(id=>esc(data.users[id].name)).join(", ") || "אין עדיין עובדים"}</p>
    <form data-form="broadcast" class="bform"><textarea id="b-text" rows="2" required placeholder="למשל: מחר אין עבודה באתר בגלל יציקה"></textarea>
    <button class="btn" ${W.length?"":"disabled"}>שלח לכולם</button></form></div>`;
}
const managerPhone = () => (Object.values(data.users).find(u=>u.role==="manager"&&u.phone)||{}).phone || "";
const myMsgs = () => { const u = me(); if(!u) return [];
  const key = u.role==="manager" ? "managers" : ui.me;
  return Object.entries(data.messages).filter(([,m])=>m.to===key).sort((a,b)=>b[1].at-a[1].at); };

function inboxView(){
  const list = myMsgs(); if(!list.length) return "";
  const unread = list.filter(([,m])=>!m.read).length;
  return `<div class="card inbox"><div class="row" style="justify-content:space-between;align-items:center">
    <h2 style="margin:0">הודעות ${unread?`<span class="pill s-done">${unread} חדשות</span>`:""}</h2>

let noticeTimer;
function showNotice(html){
  let n = document.getElementById("notice");
  if(!n){ n = document.createElement("div"); n.id="notice"; n.setAttribute("role","status"); document.body.appendChild(n); }
  n.innerHTML = html; n.hidden = false;
  clearTimeout(noticeTimer); noticeTimer = setTimeout(()=>{ n.hidden = true; }, 9000);
}

/* ---------- התראות לטלפון ---------- */
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const pushSupported = "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
let pushState = "unknown"; /* unknown | on | off */
function b64ToBytes(b64){ const p="=".repeat((4-b64.length%4)%4); const raw=atob((b64+p).replace(/-/g,"+").replace(/_/g,"/")); return Uint8Array.from(raw,c=>c.charCodeAt(0)); }
async function subscribePush(){
  const reg = await navigator.serviceWorker.ready;
  let sub = await reg.pushManager.getSubscription();
  if(!sub) sub = await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:b64ToBytes(vapidPublic)});
  const j = sub.toJSON();
  const res = await fetch("/api/subscribe",{method:"POST",headers:{"content-type":"application/json",authorization:"Bearer "+token},body:JSON.stringify({sub:{endpoint:j.endpoint||sub.endpoint,keys:j.keys}})});
  if(!res.ok){ const t = await res.text().catch(()=> ""); throw new Error("subscribe "+res.status+" "+t.slice(0,120)); }
  pushState = "on";
}
async function syncPush(){
  if(!pushSupported || !vapidPublic || !token || !me()) return;
  if(Notification.permission==="granted"){ try{ await subscribePush(); }catch(e){ pushState="off"; } render(); }
  else { pushState="off"; render(); }
}
function pushCard(){
  if(!me()) return "";
  const test = `<button class="btn ghost sm" data-act="testpush">שלח לי התראת בדיקה</button>`;
  if(pushState==="on") return `<div class="card pushcard ok"><div class="grow"><b>✓ ההתראות פועלות בטלפון הזה</b></div>${test}</div>`;
  if(pushState==="unknown") return "";
  if(isIOS && !standalone) return `<div class="card pushcard"><b>רוצה התראות לטלפון?</b><p class="note" style="margin:4px 0 0">באייפון צריך קודם להתקין: כפתור השיתוף ⬆️ ואז "הוסף למסך הבית", ולפתוח מהאייקון.</p></div>`;
  if(!pushSupported || !vapidPublic) return "";
  if(Notification.permission==="denied") return `<div class="card pushcard"><b>ההתראות חסומות</b><p class="note" style="margin:4px 0 0">כדי לקבל התראות, אפשר אותן בהגדרות הטלפון לאפליקציה הזו.</p></div>`;
  return `<div class="card pushcard"><div class="grow"><b>קבל התראות לטלפון</b><p class="note" style="margin:2px 0 0">הודעות יקפצו לבד, גם כשהאפליקציה סגורה.</p></div><button class="btn" data-act="enablepush">הפעל התראות</button></div>`;
}

function render(){
  const app = document.getElementById("app");
  if(!loaded) { app.innerHTML = '<p class="muted">טוען…</p>'; return; }
  const demo = "";
  const u = me();
  if(isSetup && PORTAL!=="team") { app.innerHTML = setupView(); return; }
  if(u && ((PORTAL==="team" && u.role==="manager") || (PORTAL==="manager" && u.role!=="manager"))){ logout(); return; }
  if(!u){ app.innerHTML = loginView(); document.title = project().name; return; }
  const vis = visibleProjects();
  const switcher = vis.length>1 ? `<select id="pick-project" class="pick" aria-label="בחירת פרויקט">${vis.map(pid=>`<option value="${pid}" ${pid===ui.pid?"selected":""}>${esc(data.projects[pid].name)}</option>`).join("")}</select>` : "";
  if(!vis.length && u.role!=="manager"){ app.innerHTML = `<div class="top"><h1>לוח עבודות</h1><button class="btn ghost sm" data-act="logout">יציאה</button></div><div class="card"><p>עדיין לא שובצת לאף פרויקט. המנהל ישבץ אותך.</p></div>`; return; }
  const head = `<div class="top"><div class="ptitle"><h1>${esc(project().name)}</h1>${switcher}</div>
    <div class="who"><span class="role">${u.role==="manager"?"מנהל":esc(tradeLabel(u.trade))}</span><b>${esc(u.name)}</b>
    <button class="btn ghost sm" data-act="logout">יציאה</button></div></div>`;
  app.innerHTML = demo + head + pushCard() + (u.role==="manager" ? managerView() : workerView(u));
}

function boardView(){
  const T = trades(), F = floorsList();
  if(!T.length) return `<div class="card"><h2>אין עדיין מקצועות</h2><p class="muted">הוסף מקצועות בלשונית "פרויקטים ומקצועות".</p></div>`;
  let total=0, approved=0, waiting=[], rejected=0;
  F.forEach(f=>T.forEach(t=>{ total++; const s=task(f,t.key); if(s.status==="approved")approved++; if(s.status==="rejected")rejected++; if(s.status==="done")waiting.push(s); }));
  const pct = total ? Math.round(approved/total*100) : 0;
  waiting.sort((a,b)=>(a.doneAt||0)-(b.doneAt||0));
  const stats = `<div class="stats">
    <div class="stat"><b>${pct}%</b><span>הושלם ואושר</span><div class="bar"><i style="width:${pct}%"></i></div></div>

    <div class="stat"><b>${rejected}</b><span>הוחזרו לתיקון</span></div>
    <div class="stat"><b>${approved}/${total}</b><span>משימות מאושרות</span></div></div>`;
  const queue = waiting.length ? `<div class="queue"><h2>ממתין לאישור</h2>${waiting.map(s=>`
    <div class="qrow"><div class="txt"><b>${esc(tradeLabel(s.trade))}</b> · ${floorName(s.floor)}

  </tbody></table></div>
  <div class="legend">${Object.values(STATUS).map(s=>`<span class="${s.c}">${s.t}</span>`).join("")}</div>`;
  return stats + broadcastCard() + queue + inboxView() + `<h2 style="font-size:20px;margin-bottom:10px">${ptype()==="building"?"חתך הבניין":"מצב העבודות לפי "+PT().many}</h2>` + grid;

    ${trades().map(t=>`<div class="notify"><b>אחרי אישור ${esc(t.label)}, להודיע ל:</b>
      <div class="checks">${trades().filter(o=>o.key!==t.key).map(o=>`<label class="ck"><input type="checkbox" id="n-${t.key}-${o.key}" data-act="togglenotify" data-k="${t.key}" data-nk="${o.key}" ${(t.notify||[]).includes(o.key)?"checked":""}> ${esc(o.label)}</label>`).join("")}</div></div>`).join("")}
    </div>`;
}

/* מי עוד עובד בקומה: מקצוע, מצב, שם וטלפון */
function othersOnFloor(f,k){
  const rows = trades().filter(t=>t.key!==k).map(t=>{
    const s = task(f,t.key), ids = responsible(f,t.key);
    if(!ids.length && s.status==="pending") return "";
    const people = ids.map(id=>{ const u=data.users[id]; return `${esc(u.name)}${u.phone?` · <a class="mono tel" href="tel:${esc(u.phone.replace(/[^\d+]/g,""))}">${esc(u.phone)}</a>`:""}`; }).join("<br>");
    return `<div class="orow"><div class="ot"><b>${esc(t.label)}</b> <span class="pill ${STATUS[s.status].c}">${STATUS[s.status].t}</span></div><div class="op">${people||'<span class="muted">לא שובץ</span>'}</div></div>`;
  }).filter(Boolean);
  return rows.length ? `<details class="others"><summary>מי עוד עובד ב${ptype()==="building"?"קומה":"מקום הזה"} (${rows.length})</summary>${rows.join("")}</details>` : "";
}
function workerView(u){
  const k = u.trade, label = tradeLabel(k);
  if(!trades().some(t=>t.key===k)) return `<div class="card"><p>המקצוע שלך עדיין לא מוגדר בפרויקט. פנה למנהל.</p></div>`;
  const F = floorsList().filter(f=>{ const a = assignee(f,k); return !a || a===ui.me; });
  if(!F.length) return inboxView() + `<div class="card"><p>עדיין לא שובצת לעבודה בפרויקט הזה. המנהל ישבץ אותך.</p></div>`;
  const done = F.filter(f=>["done","approved"].includes(task(f,k).status)).length;
  return inboxView() + `<div class="stats"><div class="stat"><b>${done}/${F.length}</b><span>${PT().many} שסימנת (${esc(label)})</span><div class="bar"><i style="width:${F.length?done/F.length*100:0}%"></i></div></div></div>
  <div class="floors">${F.map(f=>{const s=task(f,k); const st=STATUS[s.status];
    let action = "";
    if(s.status==="pending"||s.status==="rejected") action = `<button class="btn" data-act="markdone" data-f="${f}" data-k="${k}">סיימתי</button>`;
    else if(s.status==="done") action = `<button class="btn ghost sm" data-act="undo" data-f="${f}" data-k="${k}">ביטול סימון</button>`;
    return `<div class="floor">${unitsOf()?"":`<div class="num">${floorShort(f)}</div>`}
      <div class="info"><b>${floorName(f)}</b> <span class="pill ${st.c}">${st.t}</span>
      ${s.status==="rejected"&&s.reject?`<div class="note" style="color:var(--bad)">הערת מנהל: ${esc(s.reject)}</div>`:""}
      ${s.status==="approved"?`<div class="note">אושר ${fmt(s.approvedAt)}${s.praise?` · ${esc(s.praise)}`:""}</div>`:""}
      ${s.status==="done"?`<div class="note">סומן ${fmt(s.doneAt)}</div>`:""}</div>${action}${othersOnFloor(f,k)}</div>`}).join("")}</div>`;
}

/* ---------- modals ---------- */
function openModal(html){ document.getElementById("modal").innerHTML = `<div class="scrim" data-act="close"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`; const f=document.querySelector(".sheet input,.sheet textarea,.sheet button"); f&&f.focus(); }
function closeModal(){ document.getElementById("modal").innerHTML = ""; }

function taskModal(f,k){
  const s = task(f,k), st = STATUS[s.status];
  openModal(`<h3>${esc(tradeLabel(k))} · ${floorName(f)}</h3>
    <div><span class="pill ${st.c}">${st.t}</span>${s.doneBy?` <span class="muted">· ${esc(s.doneBy)}</span>`:""}</div>
    ${s.note?`<div>הערת העובד: ${esc(s.note)}</div>`:""}
    <label>הערה לעובד<textarea id="m-reject" rows="2" placeholder="מה צריך לתקן? (או מילה טובה באישור)"></textarea></label>
    <div class="row">
      <button class="btn ok" data-act="approve" data-f="${f}" data-k="${k}" ${s.status==="approved"?"disabled":""}>אישור</button>
      <button class="btn bad" data-act="reject" data-f="${f}" data-k="${k}">החזרה לתיקון</button>
      <button class="btn ghost" data-act="reset" data-f="${f}" data-k="${k}">איפוס</button>
      <button class="btn ghost" data-act="close">סגירה</button></div>
    ${(s.log||[]).length?`<div class="log">${[...s.log].reverse().map(l=>`<div><span class="mono">${fmt(l.at)}</span> · ${esc(l.by)}: ${esc(l.t)}</div>`).join("")}</div>`:""}`);
}
function doneModal(f,k){
  openModal(`<h3>${esc(tradeLabel(k))} · ${floorName(f)}</h3>
    <p style="margin:0">לסמן שהעבודה ב${esc(floorName(f))} הסתיימה? המנהל יקבל אותה לאישור.</p>
    <label>הערה (לא חובה)<textarea id="m-note" rows="2" placeholder="למשל: נשאר תיקון קטן בחדר מדרגות"></textarea></label>
    <div class="row"><button class="btn" data-act="confirmdone" data-f="${f}" data-k="${k}">כן, סיימתי</button>
    <button class="btn ghost" data-act="close">ביטול</button></div>`);
}

/* ---------- events ---------- */
document.addEventListener("click", async e=>{
  const el = e.target.closest("[data-act],[data-tab]");
  if(!el) return;
  if(el.classList.contains("scrim") && e.target!==el) return;
  if(el.dataset.tab){ ui.tab = el.dataset.tab; ui.err=""; render(); return; }
  const a = el.dataset.act, f = +el.dataset.f, k = el.dataset.k;
  try{
    if(a==="close") closeModal();
    if(a==="logout") logout();
    if(a==="open") taskModal(f,k);
    if(a==="markdone") doneModal(f,k);
    if(a==="confirmdone"){ const note=(document.getElementById("m-note")?.value||"").trim(); closeModal();
      await saveTask(f,k,{status:"done",doneBy:me().name,doneUser:ui.me,doneAt:Date.now(),note,reject:""},"סימן שסיים"+(note?` (${note})`:""));
      const text = `${me().name} (${tradeLabel(k)}) סיים את ${floorName(f)} ב${project().name}${note?`. הערה: ${note}`:""}. ממתין לאישור.`;
      await notify("managers", text);
      smsModal(managerPhone(), "מנהל", text, "נשלח למנהל לאישור"); }
    if(a==="undo") await saveTask(f,k,{status:"pending",doneBy:"",doneAt:null,note:""},"ביטל סימון");
    if(a==="approve"){ const r=(document.getElementById("m-reject")?.value||"").trim(); closeModal();
      const t = task(f,k); await saveTask(f,k,{status:"approved",approvedAt:Date.now(),approvedBy:me().name,praise:r},"אישר"+(r?` (${r})`:""));
      const tr = trades().find(x=>x.key===k) || {};
      const ids = [...new Set((tr.notify||[]).flatMap(nk=>responsible(f,nk)))];
      const next = ids.map(id=>({id,u:data.users[id]}));
      const nextText = `${project().name}: ${tradeLabel(k)} ב${floorName(f)} הסתיים ואושר. אפשר להתחיל לעבוד ב${floorName(f)}.`;
      for(const x of next) await notify(x.id, nextText);
      await tellWorker(t, `${tradeLabel(k)} ב${floorName(f)} אושר. ${r || "עבודה יפה, כל הכבוד!"}`, "העבודה אושרה", groupLink(next, nextText)); }
    if(a==="togglenotify"){ const p=project(), id=el.dataset.nk;
      const T = p.trades.map(t=>{ if(t.key!==k) return t; const n=new Set(t.notify||[]); el.checked?n.add(id):n.delete(id); return {...t, notify:[...n]}; });
      await put("projects",ui.pid,{...p,trades:T}); }
    if(a==="reject"){ const box=document.getElementById("m-reject"), r=(box?.value||"").trim();
      if(!r){ box.focus(); box.placeholder="כתוב כאן מה העובד צריך לתקן"; box.classList.add("need"); return; }
      closeModal();
      const t = task(f,k); await saveTask(f,k,{status:"rejected",reject:r},"החזיר לתיקון"+(r?` (${r})`:""));
      await tellWorker(t, `${project().name}: ${tradeLabel(k)} ב${floorName(f)} הוחזר לתיקון. מה לתקן: ${r}`, "הוחזר לתיקון"); }
    if(a==="readall"){ for(const [id,m] of myMsgs()) if(!m.read) await put("messages", id, {...m, read:true}); }
    if(a==="edituser"){ const id=el.dataset.id, u=data.users[id];
      const opts = trades().map(t=>`<option value="${t.key}" ${t.key===u.trade?"selected":""}>${esc(t.label)}</option>`).join("");
      openModal(`<h3>עריכת ${esc(u.name)}</h3>
        <label>שם מלא<input id="e-name" value="${esc(u.name)}"></label>
        <label>טלפון<input id="e-phone" type="tel" inputmode="tel" placeholder="050-0000000" value="${esc(u.phone||"")}"></label>
        ${u.role==="worker"?`<label>מקצוע<select id="e-trade">${opts}</select></label>`:""}
        <div class="row"><button class="btn" data-act="saveuser" data-id="${esc(id)}">שמירה</button><button class="btn ghost" data-act="close">ביטול</button></div>`);
      document.getElementById("e-phone").focus(); }
    if(a==="saveuser"){ const id=el.dataset.id, u=data.users[id], g=x=>document.getElementById(x);
      const upd = {...u, name:g("e-name").value.trim()||u.name, phone:g("e-phone").value.trim()};
      if(g("e-trade")) upd.trade = g("e-trade").value;
      closeModal(); await put("users", id, upd); }
    if(a==="hidenotice"){ const n=document.getElementById("notice"); if(n) n.hidden=true; }
    if(a==="enablepush"){ el.disabled=true; el.textContent="רגע…";
      const perm = await Notification.requestPermission();
      if(perm==="granted"){ try{ await subscribePush(); showNotice('<div class="ntext"><b>✓ ההתראות פועלות</b><span>מעכשיו הודעות יקפצו בטלפון.</span></div>'); }catch(e){ showErr("לא הצלחנו להפעיל התראות. נסה שוב."); } }
      else pushState="off";
      render(); }
    if(a==="testpush"){ el.disabled=true; el.textContent="שולח…";
      const info = `מצב: ${standalone?"נפתח מהאייקון":"נפתח מדפדפן"} · הרשאה: ${"Notification" in window?Notification.permission:"אין"}`;
      try{
        const tp = () => fetch("/api/testpush",{method:"POST",headers:{"content-type":"application/json",authorization:"Bearer "+token},body:"{}"}).then(x=>x.json());
        let r = await tp(), regErr = "";
        if(!r.subs){ try{ await subscribePush(); r = await tp(); }catch(e){ regErr = String(e.message||e); } }
        if(regErr){ showNotice(`<div class="ntext"><b>הרישום להתראות נכשל</b><span>${esc(regErr)} · ${esc(info)}</span></div><button class="nx" data-act="hidenotice">×</button>`); el.disabled=false; el.textContent="שלח לי התראת בדיקה"; return; }
        if(r.ok) showNotice(`<div class="ntext"><b>✓ ההתראה נשלחה</b><span>אמורה לקפוץ תוך כמה שניות. נעל את המסך כדי לראות. ${esc(info)}</span></div><button class="nx" data-act="hidenotice">×</button>`);
        else if(!r.subs) showNotice(`<div class="ntext"><b>הטלפון הזה לא רשום להתראות</b><span>לחץ "הפעל התראות" ואשר. ${esc(info)}</span></div><button class="nx" data-act="hidenotice">×</button>`);
        else showNotice(`<div class="ntext"><b>השליחה נכשלה</b><span>${esc(JSON.stringify(r.results))} · ${esc(info)}</span></div><button class="nx" data-act="hidenotice">×</button>`);
      }catch(e){ showErr("אין חיבור לשרת"); }
      el.disabled=false; el.textContent="שלח לי התראת בדיקה"; }
    if(a==="delunit"){ if(el.dataset.confirm!=="1"){ el.dataset.confirm="1"; el.textContent="בטוח?"; return; }
      const p=project(), id=+el.dataset.id; await put("projects",ui.pid,{...p,units:(p.units||[]).filter(u=>u.id!==id)}); }
    if(a==="openproj"){ ui.pid=el.dataset.id; ls.set("siteboard-pid",ui.pid); ui.tab="board"; render(); }
    if(a==="delproj"){ if(el.dataset.confirm!=="1"){ el.dataset.confirm="1"; el.textContent="בטוח? כל ההתקדמות תימחק"; return; }
      await remove("projects", el.dataset.id); }
    if(a==="togglepw"){ ui.showPw = !ui.showPw; render(); }
    if(a==="resetpw"){ const id=el.dataset.id, pw=String(Math.floor(1000+Math.random()*9000)), u=data.users[id];
      await api("resetpw",{username:id,password:pw}); ui.showPw = true; render();
      const t=`הסיסמה החדשה שלך: ${pw} (שם משתמש: ${id})`;
      openModal(`<h3>סיסמה חדשה ל${esc(u.name)}</h3><div class="smsbox mono">${esc(pw)}</div>
        <div class="row">${u.phone?`<a class="btn" href="${smsHref([u.phone], t)}">שלח לו ב-SMS</a>`:""}<button class="btn ghost" data-act="copy" data-text="${esc(t)}">העתק</button><button class="btn ghost" data-act="close">סגירה</button></div>`); }
    if(a==="copy"){ try{ await navigator.clipboard.writeText(el.dataset.text); el.textContent="הועתק"; }catch(_){ const b=document.querySelector(".smsbox"); if(b){const rg=document.createRange();rg.selectNodeContents(b);const sl=getSelection();sl.removeAllRanges();sl.addRange(rg);} } }
    if(a==="reset"){ closeModal(); await saveTask(f,k,{status:"pending",doneBy:"",doneAt:null,note:"",reject:""},"איפס"); }
    if(a==="deluser"){ if(el.dataset.confirm!=="1"){ el.dataset.confirm="1"; el.textContent="בטוח? לחץ שוב"; return; } await remove("users", el.dataset.id); }
    if(a==="deltrade"){ const p=project(); await put("projects",ui.pid,{...p,trades:p.trades.filter(t=>t.key!==k)}); }
  }catch(err){ showErr(err); }
});

document.addEventListener("submit", async e=>{
  e.preventDefault();
  const form = e.target.dataset.form, v = id => document.getElementById(id).value.trim();
  ui.err = "";
  try{
    if(form==="setup"){
      await api("setup",{project:v("s-proj"),name:v("s-name"),phone:v("s-phone"),username:v("s-user"),password:document.getElementById("s-pass").value});
    }
    if(form==="login"){
      await api("login",{username:v("l-user"),password:document.getElementById("l-pass").value,portal:PORTAL});
    }
    if(form==="adduser"){
      await api("adduser",{name:v("u-name"),username:v("u-user"),password:v("u-pass"),phone:v("u-phone"),role:"worker",trade:v("u-trade")});
      ui.err=""; render();
    }
    if(form==="addmgr"){
      await api("adduser",{name:v("g-name"),username:v("g-user"),password:v("g-pass"),phone:v("g-phone"),role:"manager",trade:""});
      ui.err=""; render();
    }
    if(form==="addproj"){
      const pid = "p" + Date.now().toString(36);
      const T = trades().map(t=>({key:t.key,label:t.label,notify:t.notify||[]}));
      const type = v("np-type"), n = +v("np-count")||0, base = {name:v("np-name"),type,trades:T,nextTrade:project().nextTrade||T.length+1,assign:{},created:Date.now()};
      if(type==="building") base.floors = Math.max(0,Math.min(60,(n||6)-1));
      else { base.units = makeUnits(type, n); base.nextUnit = base.units.length; }
      await put("projects", pid, base);
      ui.pid = pid; ls.set("siteboard-pid",pid); ui.tab="settings"; render();
    }
    if(form==="broadcast"){
      const txt = v("b-text"); if(!txt) return;
      const W = projectWorkers(ui.pid), full = `${project().name}: ${txt}`;
      for(const id of W) await notify(id, full);
      const list = W.map(id=>({id,u:data.users[id]}));
      openModal(`<h3>ההודעה נשלחה ל-${W.length} עובדים</h3>
        <p style="margin:0">כולם יראו אותה באפליקציה כשייכנסו.</p>${groupBlock(list, full)}
        <div class="row"><button class="btn ghost" data-act="close">סגירה</button></div>`);
    }
    if(form==="project"){
      const upd = {...project(),name:v("p-name")};
      if(document.getElementById("p-floors")) upd.floors = Math.max(0,Math.min(60,+v("p-floors")||0));
      await put("projects",ui.pid,upd);
    }
    if(form==="addunit"){
      const p = project(), U = p.units||[], id = p.nextUnit ?? (U.reduce((m,u)=>Math.max(m,u.id),-1)+1);
      await put("projects",ui.pid,{...p,units:[...U,{id,name:v("u-unit")}],nextUnit:id+1});
    }
    if(form==="addtrade"){
      const p = project(), n = p.nextTrade || (p.trades.length+1);
      await put("projects",ui.pid,{...p,trades:[...p.trades,{key:"t"+n,label:v("t-label")}],nextTrade:n+1});
    }
  }catch(err){ showErr(err); }
});
async function tellWorker(t, text, title, extra){
  const uname = t.doneUser || assignee(t.floor,t.trade) || Object.keys(data.users).find(id=>data.users[id].trade===t.trade && data.users[id].role==="worker");
  const w = uname ? data.users[uname] : null;
  if(uname) await notify(uname, text);
  smsModal(w?.phone||"", w?.name||"", text, title, extra);
}
function showErr(err){
  ui.err = typeof err==="string" ? err : (err?.message || "השמירה נכשלה. נסה שוב.");
  render();
  if(ui.err && !document.querySelector(".err")) toast(ui.err); /* מסך בלי שדה שגיאה */
}
function toast(t){ const d=document.createElement("div"); d.className="toast"; d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(),4000); }
function logout(){ token=null; ls.set("siteboard-token",null); ui.me=null; ui.tab="board"; render(); }
document.addEventListener("change", async e=>{
  const el = e.target;
  if(el.id==="np-type"){ const t = PTYPES[el.value], l = document.getElementById("np-count-l"), c = document.getElementById("np-count"), h = document.getElementById("np-hint");
    l.hidden = !t.count; if(t.count){ l.firstChild.textContent = t.count; c.value = t.def; }
    h.textContent = t.units ? `ייווצרו ${t.many}: ${t.units.join(", ")}. אפשר לשנות אחרי היצירה.` : "פרויקט חדש מקבל את אותם מקצועות כמו הפרויקט הפתוח. השיבוצים וההתקדמות נפרדים לכל פרויקט.";
    return; }
  if(el.id==="pick-project"){ ui.pid=el.value; ls.set("siteboard-pid",ui.pid); render(); return; }
  if(!el.matches(".assign-one,.assign-all")) return;
  const p = project(), A = {...(p.assign||{})}, k = el.dataset.k, v = el.value;
  const floors = el.matches(".assign-all") ? floorsList() : [+el.dataset.f];
  if(el.matches(".assign-all") && !v) return;
  floors.forEach(f=>{ v ? A[localId(f,k)] = v : delete A[localId(f,k)]; });
  try{ await put("projects",ui.pid,{...p,assign:A}); }catch(err){ showErr(err); }
});
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModal(); });

if("serviceWorker" in navigator){
  navigator.serviceWorker.register("/sw.js").catch(()=>{});
  navigator.serviceWorker.addEventListener("message", e=>{ if(e.data==="refresh") refresh(); });
}
refresh().then(()=>syncPush());
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden && token) refresh(); });
</script>
